<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="docker-scan-title docker-scan-desc">
<title id="docker-scan-title">Directory classification</title><desc id="docker-scan-desc">Docker Scan checks image.json first, then image-group.json, then Dockerfile. Images stop recursion; groups and unclassified directories recurse into child directories.</desc>
<style>:root{--panel:#f5f7fa;--ink:#172536;--line:#718294;--accent:#299eb0}@media(prefers-color-scheme:dark){:root{--panel:#182431;--ink:#edf3f8;--line:#a3b1bf}}text{font-family:system-ui,sans-serif;fill:var(--ink)}.card{fill:var(--panel);stroke:var(--accent);stroke-width:2}.arrow{stroke:var(--line);stroke-width:3;fill:none}</style>
<rect x="1" y="1" width="958" height="238" rx="16" fill="var(--panel)"/>
<text x="36" y="44" font-size="22" font-weight="700">Directory classification</text>
<path class="arrow" d="M304 140h30m-8-7 8 7-8 7M624 140h30m-8-7 8 7-8 7"/>
<rect class="card" x="24" y="80" width="272" height="112" rx="12"/><text x="42" y="122" font-size="19" font-weight="650">image.json?</text><text x="42" y="157" font-size="16">emit image; stop here</text>
<rect class="card" x="344" y="80" width="272" height="112" rx="12"/><text x="362" y="122" font-size="19" font-weight="650">image-group.json?</text><text x="362" y="157" font-size="16">emit group; scan children</text>
<rect class="card" x="664" y="80" width="272" height="112" rx="12"/><text x="682" y="122" font-size="19" font-weight="650">Dockerfile / neither</text><text x="682" y="157" font-size="16">emit image / scan children</text>
</svg>
